services:
  postgres:
    image: postgres:16-alpine
    container_name: before-you-vote-postgres
    environment:
      POSTGRES_DB: before_you_vote
      POSTGRES_USER: before_you_vote
      POSTGRES_PASSWORD: before_you_vote
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U before_you_vote -d before_you_vote"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
